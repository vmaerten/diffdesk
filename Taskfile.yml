version: '3'

vars:
  AIR_VERSION: v1.62.0

# Local build metadata shared by the CLI and desktop builds. Task ignores this
# key; it only holds the YAML anchors.
x-build-metadata:
  version: &build-version
    sh: node -p 'process.env.GHL_BUILD_VERSION ?? require("./package.json").version'
  commit: &build-commit
    sh: |
      if [ "${GHL_BUILD_COMMIT+x}" ]; then
        printf '%s' "$GHL_BUILD_COMMIT"
      else
        git rev-parse HEAD | tr -d '\n'
        if [ -n "$(git status --porcelain --untracked-files=no)" ]; then printf '%s' '-dirty'; fi
      fi
  date: &build-date
    sh: |
      if [ "${SOURCE_DATE_EPOCH+x}" ]; then
        case "$SOURCE_DATE_EPOCH" in ''|*[!0-9]*) echo 'Invalid SOURCE_DATE_EPOCH' >&2; exit 1;; esac
        {{if eq OS "darwin"}}date -u -r "$SOURCE_DATE_EPOCH"{{else}}date -u -d "@$SOURCE_DATE_EPOCH"{{end}} +%Y-%m-%dT%H:%M:%S.000Z
      else
        date -u +%Y-%m-%dT%H:%M:%S.000Z
      fi

tasks:
  desktop:build:
    desc: Build the macOS desktop app
    vars:
      LOCAL_BUILD_VERSION: *build-version
      LOCAL_BUILD_COMMIT: *build-commit
      LOCAL_BUILD_DATE: *build-date
      # Preserve explicit GoReleaser values; task-local constants override CLI vars.
      BUILD_VERSION: '{{.BUILD_VERSION | default .LOCAL_BUILD_VERSION}}'
      BUILD_COMMIT: '{{.BUILD_COMMIT | default .LOCAL_BUILD_COMMIT}}'
      BUILD_DATE: '{{.BUILD_DATE | default .LOCAL_BUILD_DATE}}'
      # Wails links with -mmacosx-version-min=10.13 itself; the last flag sets macOS 13.
      LDFLAGS: >-
        -s -w -extldflags=-mmacosx-version-min=13.0
        -X github.com/vmaerten/ghl/internal/app.version={{.BUILD_VERSION}}
        -X github.com/vmaerten/ghl/internal/app.commit={{.BUILD_COMMIT}}
        -X github.com/vmaerten/ghl/internal/app.buildDate={{.BUILD_DATE}}
    preconditions:
      - sh: '[ "{{OS}}" = darwin ]'
        msg: The desktop app currently targets macOS
      - sh: '[ "{{ARCH}}" = arm64 ]'
        msg: The desktop app currently targets Apple Silicon
      - sh: '{{and (regexMatch `^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$` .BUILD_VERSION) (regexMatch `^[a-f0-9]{40}(-dirty)?$` .BUILD_COMMIT) (regexMatch `^[0-9T:+.Z-]+$` .BUILD_DATE)}}'
        msg: Invalid desktop build metadata
    cmds:
      - task: desktop:assets
      - task: desktop:icon
      - mkdir -p '.task/desktop/ghl.app/Contents/MacOS' '.task/desktop/ghl.app/Contents/Resources'
      - cp .task/desktop/AppIcon.icns '.task/desktop/ghl.app/Contents/Resources/AppIcon.icns'
      # Without a deployment target, cgo targets the installed SDK's macOS release.
      - >-
        CGO_ENABLED=1 CGO_LDFLAGS='-framework UniformTypeIdentifiers' MACOSX_DEPLOYMENT_TARGET=13.0
        go -C desktop build -tags production -trimpath -ldflags={{.LDFLAGS | shellQuote}}
        -o '../.task/desktop/ghl.app/Contents/MacOS/ghl' .
      - cp desktop/Info.plist '.task/desktop/ghl.app/Contents/Info.plist'
      - >-
        plutil -replace CFBundleShortVersionString -string
        {{regexReplaceAll `-.*$` .BUILD_VERSION "" | shellQuote}}
        '.task/desktop/ghl.app/Contents/Info.plist'
      - >-
        plutil -replace GHLReleaseVersion -string {{.BUILD_VERSION | shellQuote}}
        '.task/desktop/ghl.app/Contents/Info.plist'
      - >-
        plutil -replace GHLCommit -string {{.BUILD_COMMIT | shellQuote}}
        '.task/desktop/ghl.app/Contents/Info.plist'
      - codesign --force --deep --sign - '.task/desktop/ghl.app'

  desktop:assets:
    desc: Build the desktop UI, embedded by the app and driven by the UI tests
    cmds:
      - pnpm exec vite build
      # Vite removes the tracked placeholder while cleaning its output.
      - touch desktop/assets/.gitkeep

  desktop:icon:
    internal: true
    sources: [desktop/icon/AppIcon.png]
    generates: [.task/desktop/AppIcon.icns]
    cmds:
      - mkdir -p .task/desktop/AppIcon.iconset
      - |
        set -eu
        for icon_size in 16 32 128 256 512; do
          retina_size=$((icon_size * 2))
          sips -z "$icon_size" "$icon_size" desktop/icon/AppIcon.png \
            --out ".task/desktop/AppIcon.iconset/icon_${icon_size}x${icon_size}.png" >/dev/null
          sips -z "$retina_size" "$retina_size" desktop/icon/AppIcon.png \
            --out ".task/desktop/AppIcon.iconset/icon_${icon_size}x${icon_size}@2x.png" >/dev/null
        done
      - iconutil -c icns .task/desktop/AppIcon.iconset -o .task/desktop/AppIcon.icns

  desktop:run:
    desc: Build and open a review in the reusable desktop window
    cmds:
      - task: desktop:build
      - "'.task/desktop/ghl.app/Contents/MacOS/ghl' {{.CLI_ARGS}}"

  install:
    desc: Build the app and link ghl into BIN_DIR (default ~/.local/bin) to its bundle
    vars:
      INSTALL_DIR: '{{.BIN_DIR | default (printf "%s/.local/bin" (env "HOME"))}}'
    cmds:
      - task: desktop:build
      - |
        ghl_bin={{printf "%s/ghl" .INSTALL_DIR | shellQuote}}
        mkdir -p {{.INSTALL_DIR | shellQuote}}
        # The 0.1 and 0.2 install copied the browser CLI here.
        if [ -f "$ghl_bin" ] && [ ! -L "$ghl_bin" ] && go version -m "$ghl_bin" 2>/dev/null | grep -q '^[[:space:]]*path[[:space:]]*github.com/vmaerten/ghl/cmd/ghl$'; then
          rm "$ghl_bin"
        fi
        if [ -e "$ghl_bin" ] && [ ! -L "$ghl_bin" ]; then
          echo "Cannot replace existing file or directory: $ghl_bin" >&2
          exit 1
        fi
        ln -sfn {{printf "%s/.task/desktop/ghl.app/Contents/MacOS/ghl" .ROOT_DIR | shellQuote}} "$ghl_bin"
        printf 'installed %s\n' "$ghl_bin"

  uninstall:
    desc: Remove the ghl link; preserve review state
    vars:
      INSTALL_DIR: '{{.BIN_DIR | default (printf "%s/.local/bin" (env "HOME"))}}'
    cmds:
      - |
        ghl_bin={{printf "%s/ghl" .INSTALL_DIR | shellQuote}}
        if [ -L "$ghl_bin" ]; then rm "$ghl_bin"; fi

  desktop:test:
    desc: Test desktop argument handling, shared backend and origin boundary
    platforms: [darwin]
    cmds:
      - CGO_ENABLED=1 CGO_LDFLAGS='-framework UniformTypeIdentifiers' go -C desktop test -race ./...
      - python3 -m unittest discover -s desktop -p 'test_release.py'

  desktop:vet:
    desc: Run Go vet on the desktop module
    platforms: [darwin]
    cmds:
      - CGO_ENABLED=1 CGO_LDFLAGS='-framework UniformTypeIdentifiers' go -C desktop vet ./...

  desktop:smoke:
    desc: Exercise the real native window, clipboard, instance reuse and concurrent cold launches on fixtures
    cmds:
      - task: desktop:build
      - python3 desktop/smoke.py
      - python3 desktop/cold.py

  default:
    cmds:
      - task --list

  dev:
    desc: Start React hot reload and the Go backend watcher
    deps: [dev:tools]
    cmds:
      - task: dev:serve

  dev:serve:
    internal: true
    failfast: true
    deps: [dev:go, dev:web]

  dev:go:
    desc: Watch and restart the Go backend (default port 5181)
    deps: [dev:tools]
    dir: go
    vars:
      DEV_REPO: '{{if .REPO}}{{if isAbs .REPO}}{{.REPO}}{{else}}{{.USER_WORKING_DIR}}/{{.REPO}}{{end}}{{else}}{{.USER_WORKING_DIR}}{{end}}'
      DEV_API_PORT: '{{.BACKEND_PORT | default "5181"}}'
    env:
      GHL_DEV_REPO: '{{.DEV_REPO}}'
      GHL_DEV_BASE: '{{.BASE | default ""}}'
      GHL_DEV_BACKEND_PORT: '{{.DEV_API_PORT}}'
    preconditions:
      - sh: '{{and (regexMatch `^[0-9]+$` .DEV_API_PORT) (gt (atoi .DEV_API_PORT) 0) (le (atoi .DEV_API_PORT) 65535)}}'
        msg: BACKEND_PORT must be between 1 and 65535
      - sh: '! lsof -nP -iTCP:{{.DEV_API_PORT}} -sTCP:LISTEN -t >/dev/null'
        msg: Backend port {{.DEV_API_PORT}} already in use; choose BACKEND_PORT
    cmds:
      - ../.task/bin/air -c .air.toml

  dev:web:
    desc: Serve the desktop UI with Vite in a browser, proxying to the development Go backend
    vars:
      DEV_REPO: '{{if .REPO}}{{if isAbs .REPO}}{{.REPO}}{{else}}{{.USER_WORKING_DIR}}/{{.REPO}}{{end}}{{else}}{{.USER_WORKING_DIR}}{{end}}'
      DEV_PORT: '{{.PORT | default "5180"}}'
      DEV_API_PORT: '{{.BACKEND_PORT | default "5181"}}'
      REPO_ROOT:
        sh: |
          dev_repo_root=$(git -C {{.DEV_REPO | shellQuote}} rev-parse --show-toplevel) || exit 1
          cd "$dev_repo_root"
          pwd -P
      REPO_ID: '{{base .REPO_ROOT}}-{{substr 0 7 (sha1sum .REPO_ROOT)}}'
      REVIEW_PATH: '/r/{{.REPO_ID | urlquery | replace "+" "%20"}}{{if .BASE}}?base={{.BASE | urlquery}}{{end}}'
    env:
      GHL_DEV_API: 'http://127.0.0.1:{{.DEV_API_PORT}}'
    cmds:
      - cmd: |
          until curl --noproxy '*' --fail --silent --max-time 1 "$GHL_DEV_API/api/health" >/dev/null; do sleep 0.1; done
        timeout: 30s
      - >-
        pnpm exec vite --host 127.0.0.1 --strictPort --port {{.DEV_PORT | shellQuote}}
        {{if and (ne (.OPEN | default "true") "false") (ne (.OPEN | default "true") "0")}}--open {{.REVIEW_PATH | shellQuote}}{{end}}

  dev:tools:
    desc: Install the pinned development watcher locally
    vars:
      GO_ROOT:
        sh: go env GOROOT
    status:
      - test -x .task/bin/air
      - .task/bin/air -v | grep -F {{.AIR_VERSION | shellQuote}}
    cmds:
      # Bypass toolchain shims that override GOBIN (including mise's Go shim).
      - GOBIN={{.ROOT_DIR | shellQuote}}/.task/bin {{.GO_ROOT | shellQuote}}/bin/go install github.com/air-verse/air@{{.AIR_VERSION}}

  build:
    desc: Build the review server without the desktop window, for the tests
    cmds:
      - CGO_ENABLED=0 go -C go build -trimpath -o dist/ghl-dev ./cmd/ghl-dev

  test:
    desc: Test the Go runtime, API contracts and the desktop UI
    cmds:
      - task: build
      - task: desktop:assets
      - task: test:go
      - node test/goState.ts
      - node test/goRevisions.ts
      - node test/goImages.ts
      - node test/run.ts
      - node test/desktopTabs.ts
      - task: desktop:test
      - task: test:release

  test:go:
    desc: Run Go tests with the race detector
    dir: go
    cmds:
      - go test -race ./...

  vet:
    desc: Run Go vet
    dir: go
    cmds:
      - go vet ./...

  test:dev:
    desc: Verify React refresh, Go restart and development cleanup
    deps: [dev:tools]
    cmds:
      - node test/goDev.ts

  check:
    desc: Check types, lint, formatting and Go vet
    cmds:
      - pnpm typecheck
      - pnpm lint
      - pnpm format:check
      - task: vet
      - task: desktop:vet

  release:
    desc: Build, verify and publish the checked-out release tag (optional TAG)
    vars:
      RELEASE_REF:
        sh: |
          requested_tag={{.TAG | default (env "RELEASE_TAG") | shellQuote}}
          if [ -n "$requested_tag" ]; then
            printf '%s' "$requested_tag"
          else
            git describe --tags --exact-match HEAD
          fi
    env:
      RELEASE_TAG: '{{.RELEASE_REF}}'
    cmds:
      - task: release:build
        vars: { RELEASE_TAG: '{{.RELEASE_REF}}' }
      - task: release:tap:access
        vars: { RELEASE_TAG: '{{.RELEASE_REF}}' }
      - task: release:publish
        vars: { RELEASE_TAG: '{{.RELEASE_REF}}' }
      - task: release:tap
        vars: { TAG: '{{.RELEASE_REF}}' }

  release:tap:
    desc: Point the Homebrew cask at a published stable release (optional TAG)
    vars:
      TAP_TAG:
        sh: |
          requested_tag={{.TAG | default (env "RELEASE_TAG") | shellQuote}}
          if [ -n "$requested_tag" ]; then
            printf '%s' "$requested_tag"
          else
            git describe --tags --exact-match HEAD
          fi
    env:
      RELEASE_TAG: '{{.TAP_TAG}}'
    cmds:
      - |
        set -eu
        version="${RELEASE_TAG#v}"
        case "$version" in *-*) echo "$RELEASE_TAG is a prerelease: the cask keeps the last stable release"; exit 0;; esac
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        # From the published release, so this can rerun after a failed push.
        gh release download "$RELEASE_TAG" --pattern checksums.txt --dir "$work"
        node scripts/release-cask.ts "$version" "$work/checksums.txt" > "$work/ghl.rb"
        # The workflow token reaches only this repository; the tap needs its own.
        if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then export GH_TOKEN="$HOMEBREW_TAP_TOKEN"; fi
        cask=repos/vmaerten/homebrew-tap/contents/Casks/ghl.rb
        # Concurrent tags, or a rerun of an older one, must not move the cask back.
        offered=$(gh api -H 'Accept: application/vnd.github.raw' "$cask" 2>/dev/null | sed -n 's/^  version "\(.*\)"$/\1/p' || true)
        if [ -n "$offered" ] && [ "$offered" != "$version" ] &&
          [ "$(printf '%s\n%s\n' "$offered" "$version" | sort -V | tail -n 1)" = "$offered" ]; then
          printf 'The tap already offers ghl %s; leaving it\n' "$offered"
          exit 0
        fi
        set -- -f message="ghl $version" -f content="$(base64 < "$work/ghl.rb")"
        if sha=$(gh api "$cask" --jq .sha 2>/dev/null); then set -- "$@" -f sha="$sha"; fi
        gh api --method PUT "$cask" "$@" > /dev/null
        printf 'Cask ghl %s pushed to vmaerten/homebrew-tap\n' "$version"

  release:tap:access:
    internal: true
    env:
      RELEASE_TAG: '{{.RELEASE_TAG}}'
    cmds:
      # Fail before publishing rather than leave a release the cask does not offer.
      - |
        set -eu
        case "$RELEASE_TAG" in *-*) exit 0;; esac
        # The tap is public: the workflow's own token reads it, then cannot push.
        if [ -n "${GITHUB_ACTIONS:-}" ] && [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
          echo "HOMEBREW_TAP_TOKEN is not set: the workflow could not push the cask" >&2
          exit 1
        fi
        if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then export GH_TOKEN="$HOMEBREW_TAP_TOKEN"; fi
        gh api repos/vmaerten/homebrew-tap --jq .full_name > /dev/null || {
          echo "Cannot reach vmaerten/homebrew-tap: set HOMEBREW_TAP_TOKEN" >&2
          exit 1
        }

  release:publish:
    internal: true
    env:
      RELEASE_TAG: '{{.RELEASE_TAG | default (env "RELEASE_TAG")}}'
    cmds:
      - node scripts/release-tag.ts
      - |
        set -eu
        release_version="${RELEASE_TAG#v}"
        [ "$(node -p 'require("./go/dist/release/metadata.json").version')" = "$release_version" ]
        [ "$(node -p 'require("./go/dist/release/metadata.json").commit')" = "$(git rev-parse HEAD)" ]
        [ "$(node -p 'require("./go/dist/release/metadata.json").tag')" = "$RELEASE_TAG" ]
        (cd go/dist/release && shasum -a 256 -c checksums.txt)
        set --
        case "$release_version" in *-*) set -- --prerelease;; esac
        notes=$(mktemp)
        trap 'rm -f "$notes"' EXIT
        node scripts/release-notes.ts > "$notes"
        gh release create "$RELEASE_TAG" --verify-tag --draft \
          --title "$RELEASE_TAG" --notes-file "$notes" "$@" \
          "go/dist/release/ghl_${release_version}_darwin_arm64.zip" \
          go/dist/release/checksums.txt
        gh release edit "$RELEASE_TAG" --verify-tag --draft=false

  test:release:
    desc: Test release orchestration and tag validation without publishing or creating repository tags
    cmds:
      - python3 -m unittest discover -s test -p 'releaseTask.py'
      - node test/releaseTag.ts

  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build and verify release archives without publishing
    cmds:
      - goreleaser release --snapshot --clean
      - task: release:verify

  release:build:
    desc: Build and verify a checked-out version tag without publishing
    env:
      RELEASE_TAG: '{{.RELEASE_TAG | default (env "RELEASE_TAG")}}'
    cmds:
      - node scripts/release-tag.ts
      # The notes come from CHANGELOG.md: a missing section fails before the build.
      - node scripts/release-notes.ts > /dev/null
      - goreleaser release --skip=publish --clean
      - task: release:verify
        vars: { RELEASE_TAG: '{{.RELEASE_TAG | default (env "RELEASE_TAG")}}' }

  release:verify:
    desc: Verify the checksum, archive contents, bundle metadata and the extracted app
    env:
      RELEASE_TAG: '{{.RELEASE_TAG | default (env "RELEASE_TAG")}}'
    cmds:
      - python3 desktop/release.py verify

  release:mise:
    desc: Verify mise installation, PATH, upgrades and rollback against a local release fixture
    cmds:
      - node test/goMise.ts

  release:mise:published:
    desc: Verify a published GitHub Release through mise (VERSION=X.Y.Z, optional PREVIOUS=X.Y.Z)
    requires:
      vars: [VERSION]
    cmds:
      - node test/goMise.ts --published {{.VERSION | shellQuote}}{{if .PREVIOUS}} --previous {{.PREVIOUS | shellQuote}}{{end}}

  test:browser:install:
    desc: Install the pinned Chrome for Testing build (macOS ARM64)
    cmds:
      - node scripts/test-browser.ts

