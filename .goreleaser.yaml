version: 2
project_name: diffdesk
dist: go/dist/release

before:
  hooks:
    - pnpm install --frozen-lockfile
    - node scripts/release-notices.ts
    - task desktop:build BUILD_VERSION={{ .Version }} BUILD_COMMIT={{ .FullCommit }} BUILD_DATE={{ .CommitDate }}
    - python3 desktop/release.py notices

# The app is built natively by Task, with cgo for Wails; GoReleaser only packages it.
builds:
  - skip: true

archives:
  - id: diffdesk
    meta: true
    formats: [zip]
    # Meta archives have no build target; the native Task build is macOS ARM64.
    name_template: 'diffdesk_{{ .Version }}_darwin_arm64'
    files:
      - src: .task/desktop/Diffdesk.app/Contents/Info.plist
        dst: Diffdesk.app/Contents
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'
      - src: .task/desktop/Diffdesk.app/Contents/MacOS/diffdesk
        dst: Diffdesk.app/Contents/MacOS
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'
      - src: .task/desktop/Diffdesk.app/Contents/Resources/AppIcon.icns
        dst: Diffdesk.app/Contents/Resources
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'
      - src: .task/desktop/Diffdesk.app/Contents/_CodeSignature/CodeResources
        dst: Diffdesk.app/Contents/_CodeSignature
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'
      - src: LICENSE
        info:
          mtime: '{{ .CommitDate }}'
      - src: .task/desktop/THIRD_PARTY_NOTICES.txt
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: '{{ .Version }}-next-{{ .ShortCommit }}'

# Publish the exact locally verified archive manually, without rebuilding.
# Direct invocations and snapshots never publish or need a release token.
release:
  disable: true
changelog:
  disable: true
