root = "."
tmp_dir = "../.task/go-dev"

[build]
cmd = "go build -o ../.task/go-dev/ghl ./cmd/ghl-dev"
bin = "../.task/go-dev/ghl"
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_dir = ["dist", "cmd/ghl/assets", "cmd/ghl-go-poc/assets"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 200
stop_on_error = false
send_interrupt = true
kill_delay = "1s"

[log]
time = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
